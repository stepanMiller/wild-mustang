<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English Loop — Homework Prototype</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--muted:#6f7680;--line:#e5e7eb;--blue:#315efb;--soft:#edf2ff;--green:#16784a;--gsoft:#eaf7f0;--warn:#a15c00;--wsoft:#fff5e6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:rgba(245,246,248,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topin{max-width:980px;margin:auto;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:850;letter-spacing:-.03em}.switch{display:flex;background:#e8eaee;padding:4px;border-radius:12px}.switch button{border:0;background:transparent;padding:8px 11px;border-radius:9px;font-weight:750;color:var(--muted)}.switch button.on{background:#fff;color:var(--text);box-shadow:0 1px 4px #0001}.wrap{max-width:980px;margin:auto;padding:22px 14px 90px}h1{font-size:31px;line-height:1.05;letter-spacing:-.04em;margin:6px 0 8px}h2{font-size:20px;letter-spacing:-.02em;margin:0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:850;color:var(--muted)}p{line-height:1.5}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 8px 28px #14181f0c}.goals{display:grid;gap:9px;margin-top:14px}.goal{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px}.num{width:28px;height:28px;border-radius:9px;background:#f0f2f5;display:grid;place-items:center;font-size:12px;font-weight:850;flex:0 0 auto}.taskgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.task{cursor:pointer}.task:active{transform:scale(.995)}.tasktop{display:flex;justify-content:space-between;gap:10px}.badge{display:inline-block;font-size:12px;font-weight:800;padding:5px 8px;border-radius:999px;background:#f2f3f5;color:var(--muted)}.badge.green{background:var(--gsoft);color:var(--green)}.badge.warn{background:var(--wsoft);color:var(--warn)}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.section{margin-top:25px}.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:11px;padding:10px 13px;font-weight:800}.btn.secondary{background:#fff;color:var(--text);border-color:var(--line)}.row{display:flex;gap:9px;flex-wrap:wrap}.panel{display:none}.panel.on{display:block}.back{border:0;background:transparent;color:var(--muted);padding:0;margin-bottom:10px;font-weight:750}.prompt{border:1px solid var(--line);background:#fafbfc;border-radius:12px;padding:12px;margin-top:9px}.target{background:var(--soft);color:#294ab5;border-radius:12px;padding:12px;margin-top:12px;font-size:14px;line-height:1.5}.rec{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:13px}.timer{font-size:22px;font-weight:850;font-variant-numeric:tabular-nums}.builder{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toggle{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.pilltoggle{width:44px;height:26px;border-radius:999px;background:var(--blue);padding:3px}.knob{width:20px;height:20px;border-radius:50%;background:#fff;transform:translateX(18px)}.preset{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font-size:13px;font-weight:750;margin:4px 3px 0 0}.queue{display:flex;justify-content:space-between;align-items:center;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat .big{font-size:27px;font-weight:850;letter-spacing:-.03em;margin-top:7px}.bottom{display:none}@media(max-width:700px){.taskgrid,.builder,.stats{grid-template-columns:1fr}.wrap{padding-top:18px}.bottom{display:grid;position:fixed;left:10px;right:10px;bottom:10px;grid-template-columns:repeat(3,1fr);background:#fffffff2;backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:5px;box-shadow:0 10px 35px #0002}.bottom button{border:0;background:transparent;padding:10px 4px;border-radius:10px;font-size:11px;font-weight:800;color:var(--muted)}.bottom button.on{background:#f0f2f5;color:var(--text)}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">English Loop</div><div class="switch"><button id="sbtn" class="on" onclick="role('student')">Student</button><button id="tbtn" onclick="role('tutor')">Tutor</button></div></div></header>
<main class="wrap"><div id="app"></div></main><nav class="bottom" id="bottom"></nav>
<script>
let mode='student',tab='today',detail='',recording=false,sec=0,timer=null,submitted=false;
const goals=['Speak for 2 minutes about your weekday routine without notes.','Use at least 4 target expressions correctly.','Write 120–150 words and use at least 3 target expressions.','Recall 10 of 13 active expressions without hints.'];
function role(r){mode=r;tab=r==='student'?'today':'students';detail='';document.getElementById('sbtn').classList.toggle('on',r==='student');document.getElementById('tbtn').classList.toggle('on',r==='tutor');render()}
function go(t){tab=t;detail='';render()}function openTask(x){detail=x;render()}function back(){detail='';render()}
function goalsHtml(){return `<div class="goals">${goals.map((g,i)=>`<div class="goal"><div class="num">${i+1}</div><div><strong>${g}</strong><div class="muted" style="font-size:12px;margin-top:4px">${['Speaking','Speaking + Writing','Writing','Recall'][i]}</div></div></div>`).join('')}</div>`}
function task(id,title,desc,time,gs){return `<div class="card task" onclick="openTask('${id}')"><div class="tasktop"><strong>${title}</strong><span class="badge">Start</span></div><p class="muted">${desc}</p><div class="meta"><span class="badge">${time}</span>${gs.map(x=>`<span class="badge">Goal ${x}</span>`).join('')}</div></div>`}
function studentToday(){return `<div class="eyebrow">Next lesson · Thu 27 Aug</div><h1>Your homework has a finish line.</h1><p class="muted">Daily Routine — Lesson 4. Four measurable goals instead of “read and retell”.</p><div class="card"><h2>Goals for this homework</h2>${goalsHtml()}</div><div class="section"><h2>Tasks</h2><div class="taskgrid">${task('speaking','Speaking','Three personal prompts. No retelling. Use target expressions in your own story.','8–10 min',[1,2])}${task('writing','Writing','120–150 words with required expressions.','10 min',[2,3])}${task('recall','Recall','Russian → English active recall.','10–12 min',[4])}${task('grammar','Grammar focus','Five short tasks based on recurring mistakes.','7 min',[1,2])}</div></div>`}
function speaking(){return `<button class="back" onclick="back()">← Back</button><div class="eyebrow">Homework task</div><h1>Speaking</h1><p class="muted">Done = speak for at least 2 minutes and use 4 target expressions.</p><div class="card"><h2>Your prompts</h2><div class="prompt"><b>1.</b> Walk me through a normal weekday from waking up to going to bed.</div><div class="prompt"><b>2.</b> What part of your routine has changed recently, and why?</div><div class="prompt"><b>3.</b> What do you keep doing even when work becomes difficult?</div><div class="target"><b>Target expressions:</b> eventually · despite being criticized · keep going towards · in advance</div><div class="rec"><div><div class="muted">Recording</div><div class="timer" id="tm">${fmt(sec)}</div></div><div class="row">${submitted?'<span class="badge green">Submitted</span>':recording?'<button class="btn secondary" onclick="stopRec()">Stop</button>':`<button class="btn" onclick="startRec()">Record</button>${sec?'<button class="btn" onclick="submitRec()">Submit</button>':''}`}</div></div></div>${submitted?'<div class="card"><h2>Tutor preview</h2><p>Usually I prepare important things <b>in advance</b>. I <b>keep going towards</b> my goals. <b>Despite being criticized</b> sometimes, I continue. <b>Eventually</b>, the routine becomes easier.</p><span class="badge green">4 target expressions found</span></div>':''}`}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function startRec(){recording=true;render();clearInterval(timer);timer=setInterval(()=>{sec++;let x=document.getElementById('tm');if(x)x.textContent=fmt(sec)},1000)}function stopRec(){recording=false;clearInterval(timer);render()}function submitRec(){submitted=true;render()}
function generic(title,text){return `<button class="back" onclick="back()">← Back</button><div class="eyebrow">Homework task</div><h1>${title}</h1><div class="card"><p>${text}</p><div class="target">Every task is tied to a measurable goal. The tutor sees the result before the lesson.</div><button class="btn" style="margin-top:12px">Complete demo task</button></div>`}
function tutorStudents(){return `<div class="eyebrow">Tutor workspace</div><h1>See what was actually done before the lesson.</h1><div class="stats"><div class="card stat"><div class="muted">Completion</div><div class="big">87%</div></div><div class="card stat"><div class="muted">Speaking</div><div class="big">8:42</div></div><div class="card stat"><div class="muted">Writing</div><div class="big">134</div></div><div class="card stat"><div class="muted">Recall</div><div class="big">10/13</div></div></div><div class="card"><h2>Ahav · Lesson 4 brief</h2><div class="goals"><div class="goal"><div class="num">!</div><div><strong>eventually</strong><div class="muted">Recall failed ×2</div></div></div><div class="goal"><div class="num">!</div><div><strong>despite + gerund</strong><div class="muted">Hesitation in speaking</div></div></div><div class="goal"><div class="num">!</div><div><strong>keep / keeps</strong><div class="muted">Recurring agreement error</div></div></div></div></div>`}
function tutorAssign(){return `<div class="eyebrow">Assignment builder</div><h1>Click. Click. Done.</h1><p class="muted">Build concrete homework in a few minutes, not a long free-text instruction.</p><div class="builder"><div class="card"><h2>1. Choose task types</h2>${['Speaking','Writing','Recall','Grammar'].map(x=>`<div class="toggle"><div><strong>${x}</strong><div class="muted" style="font-size:12px">Include in this homework</div></div><div class="pilltoggle"><div class="knob"></div></div></div>`).join('')}</div><div class="card"><h2>2. Pick concrete goals</h2><p class="muted">Ready-made presets:</p>${goals.map(g=>`<button class="preset">+ ${g}</button>`).join('')}</div></div><div class="card"><h2>3. Preview</h2>${goalsHtml()}<button class="btn" style="margin-top:14px" onclick="this.outerHTML='<span class=\'badge green\'>Assigned to Ahav</span>'">Assign to Ahav</button></div>`}
function tutorReview(){return `<div class="eyebrow">Review queue</div><h1>What needs your attention?</h1><div class="card queue"><div><strong>Ahav · Speaking</strong><div class="muted">Daily Routine · 8:42</div></div><span class="badge warn">Awaiting review</span></div><div class="card"><h2>Possible issues</h2><div class="goals"><div class="goal"><div class="num">1</div><div><strong>“keep going to my goal”</strong><div class="muted">Possible target: keep going towards my goal</div></div></div><div class="goal"><div class="num">2</div><div><strong>“Despite criticized”</strong><div class="muted">Likely: despite being criticized</div></div></div></div><div class="row" style="margin-top:14px"><button class="btn">Confirm</button><button class="btn secondary">Ignore</button><button class="btn secondary">Add comment</button></div></div>`}
function render(){let html='';if(mode==='student'){if(detail==='speaking')html=speaking();else if(detail==='writing')html=generic('Writing','Write 120–150 words about your weekday routine and use at least 3 target expressions.');else if(detail==='recall')html=generic('Recall','Translate 13 active expressions from Russian into English. Goal: 10/13 without hints.');else if(detail==='grammar')html=generic('Grammar focus','Five short corrections built from recurring errors, not a generic textbook unit.');else html=studentToday()}else{html=tab==='students'?tutorStudents():tab==='assign'?tutorAssign():tutorReview()}document.getElementById('app').innerHTML=html;let items=mode==='student'?[['today','Today'],['homework','Homework'],['progress','Progress']]:[['students','Students'],['assign','Assign'],['review','Review']];document.getElementById('bottom').innerHTML=items.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
render();
</script>
</body>
</html>
